name: 🐶 Snyk Security
on: [push, pull_request, workflow_dispatch]
jobs:
  snyk-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install Snyk
        run: npm install -g snyk snyk-to-html
      - name: Auth
        run: snyk auth ${{ secrets.SNYK_TOKEN }}
      - name: Test
        continue-on-error: true
        run: snyk test --all-projects --severity-threshold=high --json > snyk.json
      - name: Report
        if: always()
        run: snyk-to-html -i snyk.json -o snyk.html
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: snyk-report, path: snyk.html }
      - name: Snyk Monitor
        if: always()
        run: snyk monitor --all-projects || true
