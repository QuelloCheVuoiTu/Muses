name: 🐶 Snyk Security
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  snyk-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Snyk to HTML
      run: npm install snyk-to-html -g

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'

    - name: Smart Dependency Resolution
      continue-on-error: true
      run: |
        if [ -f "pom.xml" ]; then
          mvn install -DskipTests || true
        fi
        if [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
          chmod +x gradlew || true
          ./gradlew assemble -x test || true
        fi
        if [ -f "package.json" ]; then
          npm install --ignore-scripts || true
        fi
        if [ -f "requirements.txt" ]; then
           pip install -r requirements.txt || true
        fi
        if [ -f "go.mod" ]; then
           go mod download || true
        fi

    - name: Install Snyk CLI
      uses: snyk/actions/setup@master

    - name: Snyk Security Scan
      continue-on-error: true
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      run: |
        snyk test --all-projects --severity-threshold=low --json > snyk_results.json || true
        snyk test --all-projects --severity-threshold=low --sarif-file-output=snyk.sarif || true

    - name: Generate HTML Report
      run: |
        cat snyk_results.json | snyk-to-html -o snyk-report.html

    - name: Check Failure Threshold
      continue-on-error: false
      run: |
        if grep -q "error" snyk_results.json; then
           if [ "false" = "false" ]; then
             exit 1
           fi
        fi

    - name: Upload HTML Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: snyk-html-report
        path: snyk-report.html

    - name: Upload result to GitHub Code Scanning
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: snyk.sarif
