name: 🔍 CodeQL Analysis
on:
  push: { branches: [ "**" ] }
  pull_request: { branches: [ "**" ] }
  workflow_dispatch:
jobs:
  check-languages:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.languages }}
      has-languages: ${{ steps.set-matrix.outputs.has-languages }}
    steps:
      - uses: actions/checkout@v4
      - name: 🕵️ Dynamic Language Detection
        id: set-matrix
        shell: python
        run: |
          import os, json
          mapping = {'.py': 'python', '.js': 'javascript', '.ts': 'javascript', '.jsx': 'javascript', '.tsx': 'javascript', '.java': 'java', '.go': 'go', '.rb': 'ruby', '.cs': 'csharp', '.cpp': 'cpp', '.c': 'cpp'}
          found = set()
          ignored = {'.git', 'node_modules', 'dist', 'build', 'venv', 'bin', 'obj'}
          for r, d, f in os.walk('.'):
              d[:] = [x for x in d if x not in ignored]
              for file in f:
                  ext = os.path.splitext(file)[1].lower()
                  if ext in mapping: found.add(mapping[ext])
          langs = list(found) if found else ['none']
          has = 'true' if found else 'false'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f"languages={json.dumps(langs)}
")
              fh.write(f"has-languages={has}
")
  analyze:
    needs: check-languages
    if: needs.check-languages.outputs.has-languages == 'true'
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions: { actions: read, contents: read, security-events: write }
    strategy:
      fail-fast: false
      matrix: { language: ${{ fromJson(needs.check-languages.outputs.matrix) }} }
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: ${{ matrix.language }} }
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
        with: { category: "/language:${{matrix.language}}" }
